name: Yui Daily Insight

on:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00 / JST 09:00
  workflow_dispatch:

concurrency:
  group: yui-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-yui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai

      - name: Run Yui Brain
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python yui_brain.py

      - name: Commit and push daily insight
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/yui-dialogue.svg assets/yui-dialogue-mobile.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update Yui daily insight"
          git pull --rebase origin "$BRANCH_NAME"
          git push
