name: Yui Daily Insight

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 00:00 (JST 09:00) 自动触发
  workflow_dispatch: # 允许手动强制执行

jobs:
  update-yui:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入 README 的权限
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai

      - name: Run Yui Brain
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python yui_brain.py

      - name: Commit and Push
        run: |
          git config --global user.name "Yui-Agent[bot]"
          git config --global user.email "yui-agent@users.noreply.github.com"
          git add README.md
          git commit -m "update: Yui daily log" || echo "No changes to commit"
          git push
